apiVersion: v1
kind: Service
metadata:
  name: fantasy-hockey
spec:
  clusterIP: None
  selector:
    app: fantasy-hockey
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fantasy-hockey
spec:
  serviceName: fantasy-hockey
  replicas: 1
  selector:
    matchLabels:
      app: fantasy-hockey
  template:
    metadata:
      labels:
        app: fantasy-hockey
    spec:
      containers:
        - name: app
          image: ghcr.io/replace-me/fantasy-hockey-stats:latest
          env:
            - name: DATABASE_URL
              value: sqlite:////data/fantasy-hockey.db
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOncePod"]
        resources:
          requests:
            storage: 1Gi
