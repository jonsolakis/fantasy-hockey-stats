services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fantasy_hockey
      POSTGRES_USER: fantasy_hockey
      POSTGRES_PASSWORD: fantasy_hockey
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fantasy_hockey -d fantasy_hockey"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql+psycopg://fantasy_hockey:fantasy_hockey@postgres:5432/fantasy_hockey
    command: ["python", "-m", "app.cli", "migrate"]
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: postgresql+psycopg://fantasy_hockey:fantasy_hockey@postgres:5432/fantasy_hockey
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
