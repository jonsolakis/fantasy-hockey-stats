services:
  migrate:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: sqlite:////data/fantasy-hockey.db
    command: ["python", "-m", "app.cli", "migrate"]
    volumes:
      - ./backend:/app/backend
      - hockey_data:/data

  api:
    build:
      context: .
      target: development
    environment:
      DATABASE_URL: sqlite:////data/fantasy-hockey.db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - hockey_data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./frontend
      target: development
    environment:
      CHOKIDAR_USEPOLLING: "true"
      API_PROXY_TARGET: http://api:8000
    ports:
      - "5174:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  hockey_data:
  frontend_node_modules:
