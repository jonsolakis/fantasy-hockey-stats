nameOverride: ""
fullnameOverride: ""

api:
  image:
    repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
    pullPolicy: IfNotPresent
    tag: api-40bab2e
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources: {}

web:
  image:
    repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
    pullPolicy: IfNotPresent
    tag: web-e372204
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}

database:
  # Create this Secret outside the chart. It must contain the DATABASE_URL key,
  # for example postgresql+psycopg://user:password@postgres:5432/fantasy_hockey.
  existingSecret: ""
  secretKey: DATABASE_URL

seasonImport:
  # Imports run independently from the API so an NHL outage never blocks API startup.
  enabled: false
  schedule: "17 */6 * * *"
  seasonIds: []
  backoffLimit: 3
  resources: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fantasy-hockey.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
podAnnotations: {}
