nameOverride: ""
fullnameOverride: ""

api:
  image:
    repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
    pullPolicy: IfNotPresent
    tag: api-40bab2e
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources: {}

web:
  image:
    repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
    pullPolicy: IfNotPresent
    tag: web-e372204
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

seasonImport:
  # Imports run in the API pod before it starts, avoiding PVC multi-attach errors.
  enabled: false
  seasonIds: []

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fantasy-hockey.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
podAnnotations: {}
