nameOverride: ""
fullnameOverride: ""

api:
  image:
    repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
    pullPolicy: IfNotPresent
    tag: api-bc27e24
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8000
  resources: {}

web:
  image:
    repository: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats
    pullPolicy: IfNotPresent
    tag: web-bc27e24
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources: {}

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

migrationJob:
  # Runs as a pre-upgrade Helm hook. Initial installs are migrated by the API init container.
  enabled: true
  backoffLimit: 3

seasonImport:
  # Set true only for the Helm run that should import or refresh these seasons.
  enabled: false
  seasonIds: []
  backoffLimit: 3

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: fantasy-hockey.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

imagePullSecrets: []
podAnnotations: {}
