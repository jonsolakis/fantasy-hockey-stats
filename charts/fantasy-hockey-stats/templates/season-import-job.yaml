{{- if .Values.seasonImport.enabled }}
{{- if not .Values.persistence.enabled }}
{{- fail "seasonImport requires persistence.enabled=true so the imported stats are retained" }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fantasy-hockey-stats.fullname" . }}-season-import
  labels:
    {{- include "fantasy-hockey-stats.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.seasonImport.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "fantasy-hockey-stats.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: season-import
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: season-import
          image: "{{ .Values.api.image.repository }}:{{ default .Chart.AppVersion .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - python
            - -m
            - app.cli
            - import-season
            - {{ required "seasonImport.seasonId must be set when seasonImport.enabled=true" .Values.seasonImport.seasonId | quote }}
          env:
            - name: DATABASE_URL
              value: sqlite:////data/fantasy-hockey.db
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fantasy-hockey-stats.dataClaimName" . }}
{{- end }}
