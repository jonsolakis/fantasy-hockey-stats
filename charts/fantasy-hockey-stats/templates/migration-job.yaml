{{- if and .Values.migrationJob.enabled .Values.persistence.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fantasy-hockey-stats.fullname" . }}-migrate
  labels:
    {{- include "fantasy-hockey-stats.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit }}
  template:
    metadata:
      labels:
        {{- include "fantasy-hockey-stats.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: "{{ .Values.api.image.repository }}:{{ default .Chart.AppVersion .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command: ["python", "-m", "app.cli", "migrate"]
          env:
            - name: DATABASE_URL
              value: sqlite:////data/fantasy-hockey.db
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "fantasy-hockey-stats.dataClaimName" . }}
{{- end }}
