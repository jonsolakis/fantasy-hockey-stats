name: Verify and publish images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-and-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.digitalocean.com/jonsolakis/fantasy-hockey-stats

jobs:
  verify:
    name: Verify application and chart
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          ruff check backend
          pytest

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify Helm chart
        run: |
          helm lint charts/fantasy-hockey-stats --set database.existingSecret=fantasy-hockey-database
          helm template fantasy-hockey charts/fantasy-hockey-stats --set database.existingSecret=fantasy-hockey-database > /dev/null
          helm package charts/fantasy-hockey-stats --destination /tmp/chart-package

  publish-images:
    name: Publish API and web images
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set image tags
        id: image-tags
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}:api-${{ steps.image-tags.outputs.short_sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}:web-${{ steps.image-tags.outputs.short_sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  publish-rollout-tags:
    name: Publish Flux rollout tags
    needs: publish-images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set rollout tags
        id: image-tags
        run: |
          short_sha="${GITHUB_SHA::7}"
          echo "api_source=${REGISTRY}:api-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "web_source=${REGISTRY}:web-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "api_rollout=${REGISTRY}:api-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"
          echo "web_rollout=${REGISTRY}:web-${GITHUB_RUN_NUMBER}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Copy immutable images to rollout tags
        run: |
          docker buildx imagetools create \
            --tag "${{ steps.image-tags.outputs.api_rollout }}" \
            "${{ steps.image-tags.outputs.api_source }}"
          docker buildx imagetools create \
            --tag "${{ steps.image-tags.outputs.web_rollout }}" \
            "${{ steps.image-tags.outputs.web_source }}"

      - name: Verify rollout image platforms
        run: |
          for image in \
            "${{ steps.image-tags.outputs.api_rollout }}" \
            "${{ steps.image-tags.outputs.web_rollout }}"; do
            manifest="$(docker buildx imagetools inspect "$image")"
            printf '%s\n' "$manifest"
            grep -Eq 'Platform:.*linux/amd64' <<< "$manifest"
            grep -Eq 'Platform:.*linux/arm64' <<< "$manifest"
          done
